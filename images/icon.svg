<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background: rounded square matching galleryBanner color -->
  <rect x="0" y="0" width="128" height="128" rx="24" ry="24" fill="#1e1e2e"/>

  <!-- Tree trunk + branches (the shared git history) -->
  <g fill="none" stroke="#cdd6f4" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M64 108 L64 76"/>
    <path d="M64 76 L34 40"/>
    <path d="M64 76 L64 32"/>
    <path d="M64 76 L94 40"/>
  </g>

  <!-- Root node: the base commit shared by all worktrees -->
  <circle cx="64" cy="108" r="9" fill="#cdd6f4"/>

  <!-- Branch tips: same tree, different color per worktree -->
  <circle cx="34" cy="40" r="15" fill="#ff8a5c"/>
  <circle cx="64" cy="32" r="15" fill="#5cc8ff"/>
  <circle cx="94" cy="40" r="15" fill="#c792ea"/>
</svg>
