name: Release

# Required repository secrets (Settings > Secrets and variables > Actions):
#   VSCE_PAT - Personal Access Token for the VS Code Marketplace (vsce publish).
#              If unset, the Marketplace publish step is skipped rather than failing.
#   OVSX_PAT - Personal Access Token for Open VSX (ovsx publish).
#              If unset, the Open VSX publish step is skipped rather than failing.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v7

      - name: Set up Bun
        if: ${{ steps.release.outputs.release_created }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: bun install --frozen-lockfile

      - name: Build extension
        if: ${{ steps.release.outputs.release_created }}
        run: bun run build

      - name: Package VSIX
        if: ${{ steps.release.outputs.release_created }}
        run: bun run package

      - name: Upload VSIX to release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.release.outputs.tag_name }}" ./*.vsix --clobber

      - name: Publish to VS Code Marketplace
        if: ${{ steps.release.outputs.release_created && env.VSCE_PAT != '' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: bun run publish:vsce

      - name: Publish to Open VSX
        if: ${{ steps.release.outputs.release_created && env.OVSX_PAT != '' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: bun run publish:ovsx
