name: Feature request
description: Suggest an idea or improvement for Worktint
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Worktint aims to stay small and focused
        (git-worktree window coloring), so please explain the motivation
        clearly — it helps decide whether something fits the project's
        scope.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Is this related to a limitation or frustration you've run into?
      placeholder: e.g. I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds you've considered.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Screenshots, mockups, or links to similar features elsewhere.
    validations:
      required: false
